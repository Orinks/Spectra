# Builds the Windows portable zip for a published release, attaches it, then
# tells orinks.net (Vercel) so the site purges its cached release data and
# sends a web push to Spectra build subscribers. The notification goes out
# only after the download exists.
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the zip to, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[wx]" pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --windowed --name Spectra --paths src src/spectra/main.py

      - name: Zip and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Spectra-$($env:TAG.TrimStart('v'))-windows-x64-portable.zip"
          Compress-Archive -Path dist/Spectra -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber

      - name: Send build notification
        shell: bash
        env:
          ORINKS_BUILD_NOTIFICATION_TOKEN: ${{ secrets.ORINKS_BUILD_NOTIFICATION_TOKEN }}
        run: |
          if [ -z "$ORINKS_BUILD_NOTIFICATION_TOKEN" ]; then
            echo "ORINKS_BUILD_NOTIFICATION_TOKEN is not configured; skipping notification."
            exit 0
          fi

          payload=$(jq -n '{
            product: "Spectra",
            title: "Spectra stable release available",
            body: "A new Spectra stable release is ready to download.",
            url: "/spectra/downloads"
          }')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://www.orinks.net/api/notifications/send" \
            -H "Authorization: Bearer ${ORINKS_BUILD_NOTIFICATION_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload"
